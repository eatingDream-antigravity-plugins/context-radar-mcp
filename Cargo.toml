[package]
name = "context-radar-mcp"
version = "1.6.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/eatingDream-antigravity-plugins/context-radar"
description = "Native Rust context telemetry, 3-way cold-cache attribution, prefix-safe slice distillation, relay handoff MCP server, and execution guards for Antigravity"

[lib]
name = "context_radar_mcp"
path = "src/lib.rs"

[[bin]]
name = "context-radar-mcp"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
getrandom = "0.4"
regex = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
